  (document.body||document.documentElement).appendChild(d);
 }
 /* Fortschritt, solange eine neue Fassung im Hintergrund geladen wird (meldet der Service Worker) */

 function laden(n,von){

  if(!lade){lade=document.createElement('div');lade.setAttribute('role','status');
   lade.setAttribute('style','position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99998;background:rgba(30,28,26,.95);color:#f3efe8;font:600 15px system-ui,sans-serif;padding:11px 18px;border-radius:12px;border:1px solid #3a3632;box-shadow:0 4px 18px rgba(0,0,0,.45);pointer-events:none');

 }
 navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.typ==='laden')laden(e.data.n,e.data.von);});

<style>
:root{
  color-scheme:dark;
  --bg:#121110;--fl:#1d1b19;--fl2:#262320;--li:#3a3632;--t:#f3efe8;--mu:#b9b1a4;--akz:#f0904a;--nuss:#a8774f;
  --r:14px;--kopf:#1b1a18;--eiche:#a98a68;
  --oben:env(safe-area-inset-top,0px);--unten:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-top:var(--oben);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--oben);background:var(--kopf);z-index:60;pointer-events:none}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- Kopf ---------- */
/* Kopf wie in der Stücklisten-App: großes Logo, Titel in gesperrten Großbuchstaben, Zeile darunter */
.kopf{background:var(--kopf);color:var(--t);border-bottom:1px solid var(--li);padding-block:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kopf .innen{max-width:1400px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 34px}
.logo{display:block;height:86px;width:auto;max-width:100%}
.titel{min-width:0}
.kopf h1{font-family:"Segoe UI Light","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:24px;letter-spacing:.14em;text-transform:uppercase;margin:0;text-wrap:balance}
.kopf p{margin:6px 0 0;font-size:14px;color:var(--mu)}
@media (max-width:700px){.logo{height:66px}.kopf h1{font-size:19px}}
/* Reiter-Leiste bleibt beim Scrollen oben stehen */
nav{position:sticky;top:var(--oben);z-index:50;background:rgba(27,26,24,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--li);display:flex;gap:6px;padding:8px max(12px,env(safe-area-inset-left));overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;border-radius:22px;text-decoration:none;font-weight:600;font-size:16px;color:var(--mu);border:1px solid transparent}
nav a.an{background:var(--t);color:#1b1a18}
nav a:not(.an):hover{border-color:var(--li);color:var(--t)}
nav svg{width:18px;height:18px}

main{max-width:1400px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) calc(40px + var(--unten))}
.seite{display:none}.seite.an{display:block;animation:ein .25s ease}
@keyframes ein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Startseite ---------- */
.held{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:3/2;max-height:60vh;width:100%;cursor:zoom-in;display:block;border:0;padding:0}
.held img{width:100%;height:100%;object-fit:cover;display:block}
.held .schrift{position:absolute;left:0;right:0;bottom:0;padding:60px 26px 22px;background:linear-gradient(transparent,rgba(0,0,0,.72));text-align:left}
.held .h2{display:block;margin:0;font-size:clamp(34px,6vw,60px);line-height:1;font-weight:800;letter-spacing:.5px;color:#fff}
.held .p{display:block;margin:8px 0 0;font-size:17px;color:#e9e2d6}
.kacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media (max-width:820px){.kacheln{grid-template-columns:repeat(2,1fr)}}
.kachel{position:relative;display:block;border-radius:var(--r);overflow:hidden;background:var(--fl);aspect-ratio:4/3;text-decoration:none;border:0;padding:0;cursor:pointer;width:100%}
.kachel img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.kachel:hover img{transform:scale(1.04)}
.kachel .unten{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 13px;background:linear-gradient(transparent,rgba(0,0,0,.78));text-align:left;color:#fff}
.kachel b{display:block;font-size:20px}
.kachel span{font-size:15px;color:#e4dccf}
.kachel .marke{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:600;padding:5px 10px;border-radius:20px}
.kachel.dreid{background:#a4a4a4}

/* ---------- Gruppenseiten ---------- */
h2.titel{font-size:28px;margin:6px 0 2px}
p.unter{margin:0 0 16px;color:var(--mu)}
h3{font-size:20px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h3 small{font-size:15px;font-weight:500;color:var(--mu)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.raster.breit{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.bild{position:relative;display:block;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--fl);aspect-ratio:3/2;cursor:zoom-in;width:100%}
.bild img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease,opacity .3s}
.bild:hover img{transform:scale(1.03)}
.bild .txt{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left}
.bild.plan{aspect-ratio:auto;background:#fff}.bild.plan img{object-fit:contain;aspect-ratio:3/2;background:#fff}
.bild .spiel{position:absolute;inset:0;display:grid;place-items:center}
.bild .spiel i{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;border:2px solid rgba(255,255,255,.85)}
.bild .spiel svg{width:26px;height:26px;margin-left:4px;fill:#fff}
.hinweis{background:var(--fl2);border-left:4px solid var(--akz);padding:10px 14px;border-radius:8px;color:var(--t);font-size:16px;margin:0 0 12px}

.schalter{display:inline-flex;background:var(--fl2);border-radius:24px;padding:3px;gap:2px}
.schalter button{min-height:40px;min-width:92px;padding:0 16px;border:0;border-radius:20px;background:transparent;color:var(--mu);font-weight:600;cursor:pointer}
.schalter button.an{background:var(--t);color:#1b1a18}

footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--li);color:var(--mu);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
#offline.gut{color:#8fd19e}#offline.warn{color:#ffb27a}

/* ---------- Großansicht ---------- */
#gross{position:fixed;inset:0;z-index:100;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
#gross.an{display:block;animation:einb .2s ease}
@keyframes einb{from{opacity:0}to{opacity:1}}
#buehne{position:absolute;inset:0;overflow:hidden}
#buehne img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;max-width:none;-webkit-user-drag:none}
#buehne video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.leiste{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left));pointer-events:none;transition:opacity .25s}
.leiste>*{pointer-events:auto}
.leiste.oben{top:0;padding-top:calc(var(--oben) + 8px);padding-bottom:20px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.leiste.unten{bottom:0;padding-bottom:calc(var(--unten) + 12px);padding-top:28px;background:linear-gradient(transparent,rgba(0,0,0,.7));justify-content:center;flex-wrap:wrap}
#gross.ruhig .leiste,#gross.ruhig .pfeil{opacity:0;pointer-events:none}
#zaehler{color:#ddd;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
#untertitel{flex:1;text-align:center;color:#fff;font-size:17px;font-weight:600;text-shadow:0 1px 3px #000;min-width:0}
.rund{width:46px;height:46px;border-radius:50%;border:0;background:rgba(40,38,35,.8);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.rund svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.pfeil{position:absolute;top:50%;transform:translateY(-50%);transition:opacity .25s}
#zurueckP{left:max(10px,env(safe-area-inset-left))}#weiterP{right:max(10px,env(safe-area-inset-right))}
#tagabend{display:none}#tagabend.da{display:inline-flex}
.lade{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:dreh 1s linear infinite;display:none}
.lade.an{display:block}@keyframes dreh{to{transform:rotate(360deg)}}
@media (max-width:600px){.held{aspect-ratio:4/3}.raster{grid-template-columns:repeat(2,1fr)}.raster.breit{grid-template-columns:1fr}.pfeil{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Listen für die Großansicht ---------- */
function liste(art) {
  if (art === 'meisterstueck') return G.meisterstueck.abschnitte.flatMap(a => a.bilder);
  if (art === 'raum') return G.raum.ansichten.map(v => ({...v[zeit], text: v.text + ' · ' + zeit, ansicht: v}));
  if (art === 'plaene' || art === 'moodboard') return G[art].abschnitte.flatMap(a => a.bilder);
  return [];
}

/* ---------- Seiten bauen ---------- */
function kachelBild(b, art, i, klasse) {
  return `<button class="bild ${klasse||''}" data-art="${art}" data-i="${i}" aria-label="${esc(b.text)} groß zeigen">
    <img src="${b.klein}" alt="${esc(b.text)}" loading="lazy" decoding="async"><span class="txt">${esc(b.text)}</span></button>`;
}
function seiteStart() {
  const m = G.meisterstueck.abschnitte[0].bilder[0];
  const raum = G.raum.ansichten.find(v => v.nr === '04') || G.raum.ansichten[0];
  const k = (href, bild, titel, unter, marke, extra) =>

     ${marke ? `<span class="marke">${marke}</span>` : ''}<span class="unten"><b>${titel}</b><span>${unter}</span></span></a>`;
  const anz = l => l.length;
  return `<section class="seite" id="s-start">
    <button class="held" data-art="meisterstueck" data-i="0" aria-label="Modellfoto groß zeigen">
      <img src="${m.gross}" alt="Meisterstück Dreiklang, Modellfoto von vorn">
      <span class="schrift"><span class="h2">Dreiklang</span><span class="p">Sideboard in Nussbaum mit zwei Möbelrolladen</span></span>

    <div class="kacheln">
      ${k('#meisterstueck', G.meisterstueck.abschnitte[1].bilder[1].klein, 'Modellfotos', 'Meisterstück von allen Seiten', anz(liste('meisterstueck')) + ' Bilder')}
      ${k('#meisterstueck-filme', G.filme.filme[0].klein, 'Filme', 'Rundgang um das Meisterstück', G.filme.filme.length + ' Filme')}

      ${k('#raumkonzept', raum.Tag.klein, 'Raumbilder', 'Wohn-Esszimmer bei Tag und am Abend', anz(G.raum.ansichten) * 2 + ' Bilder')}
      ${k('#raumkonzept-plaene', G.plaene.abschnitte[0].bilder[0].klein, 'Pläne', 'Möblierung, Zonen, Licht, Wände, Aufmaß', anz(liste('plaene')) + ' Pläne')}
      ${k('#raumkonzept-moodboard', G.moodboard.abschnitte[0].bilder[0].klein, 'Moodboard und Materialcollage', 'Farben, Materialien, Stimmung', anz(liste('moodboard')) + ' Bilder')}
    </div>
  </section>`;
}
function seiteMeisterstueck() {
  let i = 0, h = `<section class="seite" id="s-meisterstueck"><h2 class="titel">Meisterstück</h2>
    <p class="unter">${esc(G.meisterstueck.unter)} · antippen für groß, wischen für das nächste Bild</p>`;
  for (const a of G.meisterstueck.abschnitte) {
    h += `<h3>${esc(a.titel)} <small>${a.bilder.length} Bilder</small></h3><div class="raster">`;
    for (const b of a.bilder) h += kachelBild(b, 'meisterstueck', i++);
    h += '</div>';
  }
  h += `<h3 id="meisterstueck-filme">Filme <small>${esc(G.filme.unter)}</small></h3><div class="raster breit">`;
  G.filme.filme.forEach((f, j) => {
    h += `<button class="bild" data-film="${j}" aria-label="${esc(f.text)} abspielen"><img src="${f.klein}" alt="" loading="lazy">
      <span class="spiel"><i><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></i></span>
      <span class="txt">${esc(f.text)} · ${f.dauer} s</span></button>`;
  });
  h += '</div>';
  h += `<h3>3D-Modell</h3><div class="raster breit"><a class="kachel dreid" href="3d.html" style="aspect-ratio:3/1"><img src="bilder/klein/vorschau_3d.jpg" alt="" loading="lazy" style="object-fit:contain">
    <span class="marke">3D</span><span class="unten"><b>Meisterstück in 3D öffnen</b><span>Drehen, zoomen, Teile ein- und ausblenden</span></span></a></div>`;
  return h + '</section>';
}
function seiteRaum() {
  let h = `<section class="seite" id="s-raumkonzept"><h2 class="titel">Raumkonzept</h2><p class="unter">${esc(G.raum.unter)}</p>`;
  h += `<h3>Raumbilder <small>${G.raum.ansichten.length} Ansichten</small></h3>`;
  if (D.hinweisHolz) h += `<p class="hinweis">Die Raumbilder zeigen das Meisterstück noch im Stand vor dem Holzwechsel; sie werden nach und nach in Nussbaum ersetzt.</p>`;
  h += `<div class="schalter" id="zeitwahl" style="margin-bottom:12px"><button data-z="Tag">Tag</button><button data-z="Abend">Abend</button></div>
    <div class="raster" id="raumraster"></div>`;
  h += `<h3 id="raumkonzept-plaene">Pläne <small>${liste('plaene').length} Pläne</small></h3><div class="raster breit">`;
  liste('plaene').forEach((b, i) => h += kachelBild(b, 'plaene', i, 'plan'));

  liste('moodboard').forEach((b, i) => h += kachelBild(b, 'moodboard', i, 'plan'));
  return h + '</div></section>';
}
function raumRaster() {
  $('#raumraster').innerHTML = liste('raum').map((b, i) => kachelBild(b, 'raum', i)).join('');

}
function setzeZeit(z) {
  zeit = z;

  raumRaster();
}

  $('#kopfzeile').textContent = `Bilder und 3D-Modell · ${liste('meisterstueck').length} Modellfotos · ${G.raum.ansichten.length * 2} Raumbilder · ${liste('plaene').length} Pläne · ${G.filme.filme.length} Filme · Stand ${D.stand}`;
  $('#nav').innerHTML = SEITEN.map(s => `<a href="${s.link || '#' + s.id}" data-s="${s.id}">${SYM[s.sym]}${s.name}</a>`).join('');
  $('#main').innerHTML = seiteStart() + seiteMeisterstueck() + seiteRaum() +
    `<footer><span id="offline">⟳ Wird für die Nutzung ohne Internet gespeichert …</span><span title="${esc(D.fassung)}">Fassung vom ${esc(D.fassungZeit)}</span></footer>`;
  raumRaster();
  $('#zeitwahl').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setzeZeit(b.dataset.z); });
  $('#main').addEventListener('click', e => {
    const f = e.target.closest('[data-film]');
    if (f) { e.preventDefault(); return oeffneFilm(+f.dataset.film); }
    const b = e.target.closest('[data-art]');
    if (b) { e.preventDefault(); oeffne(b.dataset.art, +b.dataset.i); }
  });
}
function zeige() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'start';
  const seite = h.split('-')[0];
  const ziel = ['start', 'meisterstueck', 'raumkonzept'].includes(seite) ? seite : 'start';
  document.querySelectorAll('.seite').forEach(s => s.classList.toggle('an', s.id === 's-' + ziel));
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('an', a.dataset.s === ziel));
  const anker = h.includes('-') ? document.getElementById(h) : null;
  requestAnimationFrame(() => anker ? anker.scrollIntoView({block: 'start'}) : window.scrollTo(0, 0));
}

/* ---------- Großansicht mit Zoom (zwei Finger, Doppeltippen) und Wischen ---------- */
const V = {art: null, i: 0, l: [], img: null, s: 1, x: 0, y: 0, grund: 1, nw: 0, nh: 0};
const zeiger = new Map();
let geste = null, letzterTipp = 0, ruheTimer = null;

function oeffne(art, i) {
  V.art = art; V.l = liste(art); V.i = i;
  $('#tagabend').classList.toggle('da', art === 'raum');
  $('#gross').classList.add('an'); $('#gross').classList.remove('ruhig');
  document.body.style.overflow = 'hidden';
  history.pushState({gross: 1}, '');
  ladeBild();
}
function schliesse(ausVerlauf) {
  if (!$('#gross').classList.contains('an')) return;
  $('#gross').classList.remove('an');
  $('#buehne').innerHTML = '';
  document.body.style.overflow = '';
  if (!ausVerlauf && history.state && history.state.gross) history.back();
}
function ladeBild() {
  const b = V.l[V.i], buehne = $('#buehne');
  $('#zaehler').textContent = `${V.i + 1} / ${V.l.length}`;
  $('#untertitel').textContent = b.text;
  $('#zurueckP').style.visibility = V.l.length > 1 ? '' : 'hidden';
  $('#weiterP').style.visibility = V.l.length > 1 ? '' : 'hidden';
  buehne.innerHTML = '';
  const img = new Image();
  img.alt = b.text; img.decoding = 'async'; img.draggable = false;
  img.src = b.klein;                        // sofort die kleine Fassung, dann scharf
  V.img = img; V.nw = b.w; V.nh = b.h;
  img.style.width = b.w + 'px'; img.style.height = b.h + 'px';
  buehne.appendChild(img);
  passend();
  const scharf = new Image();
  $('#lade').classList.add('an');
  scharf.onload = () => { if (V.img === img) { img.src = b.gross; } $('#lade').classList.remove('an'); };
  scharf.onerror = () => $('#lade').classList.remove('an');
  scharf.src = b.gross;
  // Nachbarn vorladen
  [V.i + 1, V.i - 1].forEach(j => { const n = V.l[(j + V.l.length) % V.l.length]; if (n) { const p = new Image(); p.src = n.gross; } });
  document.querySelectorAll('#tagabend button').forEach(x => x.classList.toggle('an', x.dataset.z === zeit));
}
function masse() { const r = $('#buehne').getBoundingClientRect(); return {w: r.width, h: r.height}; }
function passend() {
  const m = masse();
  V.grund = Math.min(m.w / V.nw, m.h / V.nh);
  V.s = V.grund; V.x = (m.w - V.nw * V.s) / 2; V.y = (m.h - V.nh * V.s) / 2;
  setze(false);
}
function begrenze() {
  const m = masse(), bw = V.nw * V.s, bh = V.nh * V.s;
  V.x = bw <= m.w ? (m.w - bw) / 2 : Math.min(0, Math.max(m.w - bw, V.x));
  V.y = bh <= m.h ? (m.h - bh) / 2 : Math.min(0, Math.max(m.h - bh, V.y));
}
function setze(weich) {
  if (!V.img) return;
  V.img.style.transition = weich ? 'transform .25s ease' : 'none';
  V.img.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
}
function zoomUm(px, py, neu) {
  neu = Math.max(V.grund, Math.min(V.grund * 6, neu));
  V.x = px - (px - V.x) * neu / V.s; V.y = py - (py - V.y) * neu / V.s; V.s = neu;
  begrenze();
}
function blaettern(d) {
  if (V.l.length < 2) return;
  V.i = (V.i + d + V.l.length) % V.l.length; ladeBild();
}
function ruhe() { clearTimeout(ruheTimer); $('#gross').classList.remove('ruhig'); }

const B = $('#buehne');
B.addEventListener('pointerdown', e => {
  B.setPointerCapture(e.pointerId);
  zeiger.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (zeiger.size === 1) geste = {art: 'eins', sx: e.clientX, sy: e.clientY, x0: V.x, y0: V.y, t: Date.now(), bewegt: false};
  if (zeiger.size === 2) {
    const [a, b] = [...zeiger.values()];
    geste = {art: 'zwei', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: V.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, x0: V.x, y0: V.y};
  }
});
B.addEventListener('pointermove', e => {
  if (!zeiger.has(e.pointerId) || !geste) return;
  zeiger.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const r = B.getBoundingClientRect();
  if (geste.art === 'zwei' && zeiger.size >= 2) {
    const [a, b] = [...zeiger.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const neu = Math.max(V.grund * .8, Math.min(V.grund * 6, geste.s0 * d / geste.d0));
    const px = geste.mx - r.left, py = geste.my - r.top;
    V.s = neu; V.x = px - (px - geste.x0) * neu / geste.s0 + (mx - geste.mx); V.y = py - (py - geste.y0) * neu / geste.s0 + (my - geste.my);
    setze(false);
  } else if (geste.art === 'eins') {
    const dx = e.clientX - geste.sx, dy = e.clientY - geste.sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) geste.bewegt = true;
    if (V.s > V.grund * 1.01) { V.x = geste.x0 + dx; V.y = geste.y0 + dy; begrenze(); setze(false); }
    else { V.x = geste.x0 + dx; V.y = geste.y0 + Math.max(0, dy) * .6; setze(false);   // mitziehen beim Wischen
      $('#gross').style.background = `rgba(0,0,0,${Math.max(.4, 1 - Math.max(0, dy) / 600)})`; }
  }
});
function los(e) {
  if (!zeiger.has(e.pointerId)) return;
  zeiger.delete(e.pointerId);
  if (!geste) return;
  if (geste.art === 'zwei') {
    if (zeiger.size === 0) { if (V.s < V.grund) passend(); begrenze(); setze(true); geste = null; }
    else { const [a] = [...zeiger.values()]; geste = {art: 'eins', sx: a.x, sy: a.y, x0: V.x, y0: V.y, t: Date.now(), bewegt: true}; }
    return;
  }
  const dx = e.clientX - geste.sx, dy = e.clientY - geste.sy, schnell = Date.now() - geste.t < 350;
  $('#gross').style.background = '';
  if (V.s <= V.grund * 1.01) {
    if (dy > 110 && Math.abs(dy) > Math.abs(dx)) { geste = null; return schliesse(); }
    if (Math.abs(dx) > 70 || (schnell && Math.abs(dx) > 30)) { geste = null; return blaettern(dx < 0 ? 1 : -1); }
    passend();
    setze(true);
  }
  if (!geste.bewegt) {          // Tippen
    const jetzt = Date.now(), r = B.getBoundingClientRect();
    if (jetzt - letzterTipp < 300) {
      letzterTipp = 0;
      if (V.s > V.grund * 1.01) passend(); else zoomUm(e.clientX - r.left, e.clientY - r.top, V.grund * 2.5);
      setze(true);
    } else {
      letzterTipp = jetzt;
      setTimeout(() => { if (letzterTipp === jetzt) $('#gross').classList.toggle('ruhig'); }, 310);
    }
  }
  geste = null;
}
B.addEventListener('pointerup', los);
B.addEventListener('pointercancel', los);
B.addEventListener('wheel', e => {
  e.preventDefault(); const r = B.getBoundingClientRect();
  zoomUm(e.clientX - r.left, e.clientY - r.top, V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); setze(false);
}, {passive: false});
$('#zu').onclick = () => schliesse();
$('#zurueckP').onclick = () => { ruhe(); blaettern(-1); };
$('#weiterP').onclick = () => { ruhe(); blaettern(1); };
$('#tagabend').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.z === zeit) return;
  setzeZeit(b.dataset.z); V.l = liste('raum'); ladeBild();
});
addEventListener('keydown', e => {
  if (!$('#gross').classList.contains('an')) return;
  if (e.key === 'Escape') schliesse();
  if (e.key === 'ArrowRight') blaettern(1);
  if (e.key === 'ArrowLeft') blaettern(-1);
});
addEventListener('resize', () => { if ($('#gross').classList.contains('an') && V.img) passend(); });
addEventListener('popstate', () => schliesse(true));

/* ---------- Filme ---------- */
function oeffneFilm(j) {
  const f = G.filme.filme[j];
  V.art = 'film'; V.img = null; V.l = [];
  $('#tagabend').classList.remove('da');
  $('#zaehler').textContent = `${j + 1} / ${G.filme.filme.length}`;
  $('#untertitel').textContent = f.text;
  $('#zurueckP').style.visibility = 'hidden'; $('#weiterP').style.visibility = 'hidden';
  $('#buehne').innerHTML = `<video src="${f.film}" poster="${f.klein}" controls playsinline autoplay muted loop preload="auto"></video>`;
  $('#gross').classList.add('an'); $('#gross').classList.remove('ruhig');
  document.body.style.overflow = 'hidden';
  history.pushState({gross: 1}, '');
}

/* ---------- Offline-Stand anzeigen ---------- */
async function offlineStand() {
  const el = $('#offline');
  if (!('caches' in window) || !('serviceWorker' in navigator)) { el.textContent = 'Ohne Internet nicht verfügbar (Browser kann es nicht)'; el.className = 'warn'; return; }
  try {
    const c = await caches.open(D.fassung);
    const n = (await c.keys()).length;
    if (n >= D.anzahl) { el.textContent = '✓ Auf diesem Gerät gespeichert – geht auch ohne Internet'; el.className = 'gut'; return; }
    el.textContent = `⟳ Wird für die Nutzung ohne Internet gespeichert … (${n} von ${D.anzahl})`; el.className = '';
    setTimeout(offlineStand, 2500);
  } catch (e) {
    el.textContent = e && e.name === 'QuotaExceededError' ? '⚠ Speicher auf dem Gerät voll – ohne Internet nicht alles verfügbar' : '⚠ Offline-Speicher nicht verfügbar';
    el.className = 'warn';
  }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

baue(); zeige();
addEventListener('hashchange', zeige);
offlineStand();
</script>
